name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Ядро (Python)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Установка зависимостей
        run: uv sync --locked --all-extras

      - name: ruff check
        run: uv run --frozen ruff check

      - name: ruff format --check
        run: uv run --frozen ruff format --check

      - name: mypy --strict
        run: uv run --frozen mypy

      - name: Архитектурные контракты (import-linter)
        run: uv run --frozen lint-imports

      - name: Длина файлов (R-10)
        run: uv run --frozen python tools/check_file_length.py

      - name: PROJECT_MAP.md актуален
        run: uv run --frozen python -m tools.gen_map --check

      - name: protocol.gen.ts и protocol.md актуальны
        run: uv run --frozen python tools/gen_protocol.py --check

      - name: pytest + покрытие
        run: uv run --frozen pytest --cov --cov-report=term

  ui:
    name: UI (Svelte + Tauri)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm lint

      - name: prettier --check
        run: pnpm format:check

      - name: svelte-check
        run: pnpm check

      - name: vitest
        run: pnpm test

      - name: Сборка фронтенда
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: cargo fmt --check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
