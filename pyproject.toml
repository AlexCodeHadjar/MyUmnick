[project]
name = "vtuber"
version = "0.1.0"
description = "Локальный ИИ-витюбер: ядро (оркестратор, конвейер ответа, память)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "structlog>=24.4",
    "websockets>=14",
]

[project.optional-dependencies]
# Движок TTS Silero (ADR-0012): torch только CPU — озвучка на CPU, видеокарта отдана LLM (T-11).
silero = ["numpy>=2.0", "torch>=2.6"]
# Движок TTS Piper (ADR-0013): ONNX без torch; GPL-3.0 — приложение не распространяется.
piper = ["piper-tts>=1.8,<2"]
# Английский голос Kokoro-82M (ADR-0034): ONNX, веса Apache-2.0; фонемизатор GPL-3.0 — как у Piper.
kokoro = ["kokoro-onnx>=0.6,<0.7", "numpy>=2.0"]
# Долговременная память (ADR-0015): e5 в ONNX на CPU, токенизатор HF, векторы в sqlite-vec.
memory = ["numpy>=2.0", "onnxruntime>=1.20", "sqlite-vec>=0.1.6", "tokenizers>=0.20"]
# Голосовой ввод (ADR-0016): faster-whisper (CTranslate2) и Silero VAD в ONNX.
stt = ["faster-whisper>=1.2,<2", "numpy>=2.0", "onnxruntime>=1.20"]
# Звуки вокруг и собеседники (ADR-0027, ADR-0029): sherpa-onnx, CPU.
sounds = ["numpy>=2.0", "sherpa-onnx>=2.0,<3"]
# Чтение новостей плагином web_search (ADR-0036): текст статьи без браузера, Apache-2.0.
web = ["trafilatura>=2.3,<3"]

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "import-linter>=2.1",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]
packaging = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", ".", "plugins/stream_chat/src", "plugins/obs/src", "plugins/tools/src", "plugins/stream_director/src", "plugins/web_search/src", "plugins/singing/src", "plugins/code_assistant/src"]  # "." — чтобы tools и tests считались своими пакетами при сортировке импортов
extend-exclude = ["docs/archive"]  # ruff форматирует код в .md; архивные примеры не трогаем

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203", "D213",                # конфликтующие пары правил docstring
  "COM812", "ISC001",            # конфликтуют с форматтером
  "RUF001", "RUF002", "RUF003",  # кириллица в строках/комментариях — норма для проекта
  "CPY001",                      # заголовок копирайта в каждом файле не требуется
  "TRY003",                      # R-45: сообщение «что делать» пишется на месте raise
  "D105", "D107",                # R-52: __init__ и магические методы описывает docstring класса
]

[tool.ruff.lint.per-file-ignores]
# FBT001 — bool в parametrize; ARG — фейки повторяют сигнатуры портов; S311 — random для данных.
"tests/**" = ["S101", "D", "PLR2004", "ANN", "EM", "FBT001", "ARG", "S311"]
# Каталог без __init__.py: имя совпадает с пакетом `packaging` из PyPI.
"packaging/**" = ["T201", "INP001"]
"tools/**" = ["T201"]          # CLI-скрипты пишут результат в консоль
"src/vtuber/domain/errors.py" = ["N818"]  # имена ошибок закреплены в docs/architecture.md

[tool.ruff.lint.mccabe]
max-complexity = 8             # R-12

[tool.ruff.lint.pylint]
max-args = 5                   # R-13: 4 + self
max-statements = 20            # R-11
max-branches = 8
max-returns = 4                # R-16

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
disallow_any_explicit = true   # R-18
files = ["src", "tests", "tools", "plugins/example/src", "plugins/stream_chat/src", "plugins/obs/src", "plugins/tools/src", "plugins/stream_director/src", "plugins/web_search/src", "plugins/singing/src", "plugins/code_assistant/src", "packaging/build_sidecar.py", "packaging/fetch_llama.py", "packaging/smoke_sidecar.py"]
mypy_path = "src:plugins/stream_chat/src:plugins/obs/src:plugins/tools/src:plugins/stream_director/src:plugins/web_search/src:plugins/singing/src:plugins/code_assistant/src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/stream_chat/src", "plugins/obs/src", "plugins/tools/src", "plugins/stream_director/src", "plugins/web_search/src", "plugins/singing/src", "plugins/code_assistant/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["gpu: требует видеокарту", "slow: долгий тест"]
addopts = "-m 'not gpu and not slow' --strict-markers --strict-config"

[tool.coverage.run]
source = ["vtuber"]
branch = true
omit = ["*/vtuber/__main__.py"]  # двухстрочный запуск процесса; логика — в bootstrap.main

[tool.coverage.report]
fail_under = 85                # NFR-08
show_missing = true
skip_covered = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
