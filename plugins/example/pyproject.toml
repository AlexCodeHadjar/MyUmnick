[project]
name = "vtuber-example"
version = "0.1.0"
description = "Плагин-пример: считает законченные ходы и пишет их в лог."
requires-python = ">=3.12,<3.13"
dependencies = ["vtuber"]

[project.entry-points."vtuber.plugins"]
example = "vtuber_example:ExamplePlugin"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
