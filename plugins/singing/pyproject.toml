[project]
name = "vtuber-singing"
version = "0.1.0"
description = "Плагин: персонаж исполняет готовую запись по команде ведущего."
requires-python = ">=3.12,<3.13"
dependencies = ["vtuber"]

[project.entry-points."vtuber.plugins"]
singing = "vtuber_singing:SingingPlugin"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
