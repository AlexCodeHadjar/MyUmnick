[project]
name = "vtuber-stream-chat"
version = "0.1.0"
description = "Плагин: витюбер отвечает зрителям из чата Twitch."
requires-python = ">=3.12,<3.13"
dependencies = ["vtuber", "websockets>=14"]

[project.entry-points."vtuber.plugins"]
stream_chat = "vtuber_stream_chat:StreamChatPlugin"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
