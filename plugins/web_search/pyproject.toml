[project]
name = "vtuber-web-search"
version = "0.1.0"
description = "Плагин: поиск в интернете по явной просьбе через локальный SearXNG."
requires-python = ">=3.12,<3.13"
dependencies = ["vtuber", "httpx>=0.27"]

[project.entry-points."vtuber.plugins"]
web_search = "vtuber_web_search:WebSearchPlugin"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
