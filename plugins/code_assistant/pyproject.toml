[project]
name = "vtuber-code-assistant"
version = "0.1.0"
description = "Плагин: помощник-программист на отдельной модели."
requires-python = ">=3.12,<3.13"
dependencies = ["vtuber"]

[project.entry-points."vtuber.plugins"]
code_assistant = "vtuber_code_assistant:CodeAssistantPlugin"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
