[project]
name = "vtuber-obs"
version = "0.1.0"
description = "Плагин: субтитры и смена сцены в OBS через OBS WebSocket 5."
requires-python = ">=3.12,<3.13"
dependencies = ["vtuber", "websockets>=14"]

[project.entry-points."vtuber.plugins"]
obs = "vtuber_obs:ObsPlugin"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
