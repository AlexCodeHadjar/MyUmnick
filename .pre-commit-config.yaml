# Инструменты берутся из uv.lock через `uv run` — одна версия для хуков, CI и редактора.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        # --force-exclude: исключения из pyproject (docs/archive) действуют и на явно переданные
        # файлы; markdown — потому что ruff 0.17 форматирует код в .md, как и CI.
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi, markdown]
      - id: mypy
        name: mypy --strict
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: lint-imports
        name: import-linter (R-01, R-02)
        entry: uv run --frozen lint-imports
        language: system
        files: ^(src/|\.importlinter$)
        pass_filenames: false
      - id: file-length
        name: длина файлов (R-10)
        entry: uv run --frozen python tools/check_file_length.py
        language: system
        types: [python]
      - id: gen-map
        name: PROJECT_MAP.md актуален
        entry: uv run --frozen python tools/gen_map.py --check
        language: system
        files: ^(src/|tools/gen_map\.py$|docs/ai/PROJECT_MAP\.md$)
        pass_filenames: false
