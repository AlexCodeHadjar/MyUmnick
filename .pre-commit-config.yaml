# Инструменты берутся из uv.lock через `uv run` — одна версия для хуков, CI и редактора.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        # pnpm 12 пишет pnpm-lock.yaml несколькими YAML-документами.
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        # --force-exclude: исключения из pyproject (docs/archive) действуют и на явно переданные
        # файлы; markdown — потому что ruff 0.17 форматирует код в .md, как и CI.
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi, markdown]
      - id: mypy
        name: mypy --strict
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: lint-imports
        name: import-linter (R-01, R-02)
        entry: uv run --frozen lint-imports
        language: system
        files: ^(src/|\.importlinter$)
        pass_filenames: false
      - id: file-length
        name: длина файлов (R-10)
        entry: uv run --frozen python tools/check_file_length.py
        language: system
        types: [python]
      - id: gen-map
        name: PROJECT_MAP.md актуален
        entry: uv run --frozen python -m tools.gen_map --check
        language: system
        files: ^(src/|ui/src/|tools/(gen_map|ui_map)\.py$|docs/ai/PROJECT_MAP\.md$)
        pass_filenames: false
      - id: gen-protocol
        name: protocol.gen.ts и protocol.md актуальны
        entry: uv run --frozen python tools/gen_protocol.py --check
        language: system
        files: ^(src/vtuber/(gateway|domain)/|tools/gen_protocol\.py$|docs/protocol\.md$|ui/src/core/protocol\.gen\.ts$)
        pass_filenames: false
      # UI (S-5.1): инструменты из ui/pnpm-lock.yaml. Каждый хук проверяет весь ui/ — eslint с
      # projectService и svelte-check всё равно строят программу целиком.
      - id: ui-eslint
        name: eslint (ui)
        entry: pnpm --dir ui lint
        language: system
        files: ^ui/(src/|[^/]+\.(js|ts|json)$)
        pass_filenames: false
      - id: ui-prettier
        name: prettier --check (ui)
        entry: pnpm --dir ui format:check
        language: system
        files: ^ui/(src/|[^/]+\.(js|ts|json|html)$)
        pass_filenames: false
      - id: ui-svelte-check
        name: svelte-check (ui)
        entry: pnpm --dir ui check
        language: system
        files: ^ui/(src/|tsconfig\.json$|svelte\.config\.js$)
        pass_filenames: false
      - id: ui-vitest
        name: vitest (ui)
        entry: pnpm --dir ui test
        language: system
        files: ^ui/(src/|vite\.config\.ts$|package\.json$)
        pass_filenames: false
      - id: ui-cargo-fmt
        name: cargo fmt --check (ui/src-tauri)
        entry: cargo fmt --check --manifest-path ui/src-tauri/Cargo.toml
        language: system
        files: ^ui/src-tauri/.*\.rs$
        pass_filenames: false
