и болтаются вверх-вниз</text><text x="306" y="77" font-size="11" fill="#27ae60">ноги/сапоги</text><circle cx="290" cy="96" r="9" fill="#6f6f6f"/><text x="290" y="100" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">2</text><text x="306" y="100" font-size="13" fill="#222">лёгкое дыхание</text><text x="306" y="115" font-size="11" fill="#6f6f6f">тело/вес</text><text x="282" y="320" font-size="12" fill="#444">Кадры: 4 · 3 к/с · туда-обратно</text><rect x="282" y="332" width="34" height="26" rx="4" fill="#f4f6fb" stroke="#99a"/><text x="299.0" y="350" font-size="12" text-anchor="middle" fill="#333">1</text><rect x="320" y="332" width="34" height="26" rx="4" fill="#f4f6fb" stroke="#99a"/><text x="337.0" y="350" font-size="12" text-anchor="middle" fill="#333">2</text><rect x="358" y="332" width="34" height="26" rx="4" fill="#f4f6fb" stroke="#99a"/><text x="375.0" y="350" font-size="12" text-anchor="middle" fill="#333">3</text><rect x="396" y="332" width="34" height="26" rx="4" fill="#f4f6fb" stroke="#99a"/><text x="413.0" y="350" font-size="12" text-anchor="middle" fill="#333">4</text><text x="282" y="374" font-size="11" fill="#666">1→4→1 (обратно теми же кадрами)</text></svg>
