[package]
name = "vtuber-ui"
version = "0.3.1"
description = "AI VTuber — оболочка окна (Tauri 2)"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# Суффикс _lib: на Windows имя библиотеки, совпадающее с бинарником, ломает сборку (cargo#8519).
name = "vtuber_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon — значок фонового режима (ADR-0041): флаг уже стоящей зависимости.
tauri = { version = "2", features = ["tray-icon"] }
# Звук компьютера для сферы (ADR-0039): WASAPI loopback. serde — числа полос в событие окна.
cpal = "0.16"
serde = { version = "1", features = ["derive"] }
# «Сопровождение» (ADR-0045): окна рабочего стола для спутника. Крейт уже в дереве у Tauri.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  # Двойной щелчок по персонажу в режиме «Не мешать кликам» (ADR-0045, дополнение 2026-11-18).
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# «Потыкать» в кнопки и значки (ADR-0048): UI Automation. Та же версия, что у Tauri — второй копии нет.
windows = { version = "0.62", features = [
  # Что играет в системе — «смотрим вместе» (ADR-0052): сеансы мультимедиа Windows (WinRT).
  "Foundation",
  "Media_Control",
  # …и у кого реально звучит звук: аудиосеансы Windows (Core Audio), если источник не сообщает о себе.
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Окно — тонкая оболочка; размер и время старта важнее скорости кода Rust.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
