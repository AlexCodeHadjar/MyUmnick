[package]
name = "vtuber-ui"
version = "0.1.0"
description = "AI VTuber — оболочка окна (Tauri 2)"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# Суффикс _lib: на Windows имя библиотеки, совпадающее с бинарником, ломает сборку (cargo#8519).
name = "vtuber_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon — значок фонового режима (ADR-0041): флаг уже стоящей зависимости.
tauri = { version = "2", features = ["tray-icon"] }
# Звук компьютера для сферы (ADR-0039): WASAPI loopback. serde — числа полос в событие окна.
cpal = "0.16"
serde = { version = "1", features = ["derive"] }

[profile.release]
# Окно — тонкая оболочка; размер и время старта важнее скорости кода Rust.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
