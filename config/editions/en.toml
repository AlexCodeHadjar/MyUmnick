# Английское издание без цензуры (Этап 20, ADR-0032). Поверх default.toml; выбор мастера —
# config/setup.en.toml, личные правки — config/user.en.toml. Языковые ключи общего user.toml
# (персона, голос, память…) здесь не действуют — список в bootstrap/edition.py.
# Голос — Kokoro af_heart, запасной Piper en_US-ljspeech (ADR-0034); модель — S-20.9, до тех пор общая.

[edition]
id = "en"
language = "en"
content_profile = "unfiltered"
stream_safe = false            # в эфир пока не идёт (решение пользователя, 2026-11-09)

[persona]
file = "personas/en/default.toml"

[pipeline.filler]
phrases = ["Hmm…", "So…", "Let me see…"]

[tts]                          # Kokoro af_heart (выбор пользователя на слух, 2026-11-10); запасной — Piper
backend = "kokoro_piper"

[tts.piper]
model_path = "models/tts/piper/en_US-ljspeech-medium.onnx"   # датасет LJ Speech — общественное достояние
sample_rate = 22050            # из en_US-ljspeech-medium.onnx.json

[llm.llamacpp]
forbid_cyrillic = true         # ответ только по-английски: русские слова голос не прочтёт

[context]
chars_per_token = 4.0          # оценка для английского; калибровать по /tokenize (S-20.3)

[stt.whisper]
language = "en"

[stt.addressing]
names = ["mika", "meeka", "mica"]

[memory]                       # своя память: факты и заметки изданий не смешиваются
store_path = "data/en/memory.sqlite"
vault_path = "data/en/vault"

[setup]
choice_file = "config/setup.en.toml"
catalog_file = "config/catalog.en.toml"   # свой голос; LLM — до выбора английской модели (S-20.9)
