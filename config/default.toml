# Настройки по умолчанию — единственный источник умолчаний (в коде их нет).
# Порядок: default.toml < editions/<издание>.toml < setup[.<издание>].toml < user.toml < user.<издание>.toml < env.
# Локальные переопределения: config/user.toml (не в git, пример — user.example.toml).
# Переменные окружения сильнее файлов: VTUBER_<СЕКЦИЯ>__<ПОЛЕ>, например VTUBER_LOGGING__LEVEL=DEBUG.
# Новая секция появляется вместе с модулем, который её описывает: лишний ключ — ошибка старта.

[edition]                      # издание (Этап 20, ADR-0032); задаёт config/editions/<id>.toml, а не user.toml
id = "ru"                      # ru | en; выбирается до старта: --edition или VTUBER_EDITION__ID
language = "ru"                # язык пакета ядра (BCP-47)
content_profile = "standard"   # standard | unfiltered (ADR-0033)
stream_safe = false            # правила площадок поверх unfiltered; пока только поле (STAGE_20, 4.4)

[logging]
level = "INFO"                 # DEBUG | INFO | WARNING | ERROR; DEBUG — потоковые детали (T-15)
file = "logs/app.jsonl"        # относительно корня проекта

[telemetry]
traces_file = "logs/traces.jsonl"  # замеры стадий хода (MetricRecorded), строка JSON на замер

[gateway]
host = "127.0.0.1"             # только localhost: UI и ядро на одной машине (ADR-0002)
port = 8765                    # `python -m vtuber serve`; UI подключается по ws://host:port

[persona]
file = "personas/default.toml" # характер, манера речи, правила; меняется без правки кода (FR-11)

[context]
max_history_tokens = 6000      # история в промпте; превысила — усечение блоком (T-04)
trim_ratio = 0.5               # какую долю лимита отрезать за раз: кэш ломается редко
chars_per_token = 3.0          # оценка для русского; калибровать по токенизатору модели (S-9.1)
message_overhead_tokens = 4    # служебные токены шаблона чата на сообщение

[llm]
backend = "llamacpp"           # llamacpp | openai_compat (LM Studio, Ollama и т.п.)
base_url = "http://127.0.0.1:8080"   # llama-server (scripts/start_llm.ps1)
model = "local"                # имя модели в запросе; llama-server принимает любое
connect_timeout_s = 1.0        # localhost: соединение — доли миллисекунды; больше — сервер не запущен
read_timeout_s = 30.0          # максимум ожидания следующей порции, включая prefill длинного промпта

[llm.llamacpp]
slot_id = 0                    # слот диалога: его KV-кэш живёт между ходами (T-03); 1 — фон (Этап 10)
enable_thinking = false        # reasoning-режим шаблона чата — выключен в горячем пути (T-08)
forbid_foreign_scripts = true  # запрет иероглифов и т.п. в ответе: модель изредка их вставляет (ADR-0004)

[llm.generation]
max_tokens = 256               # короткие ответы по умолчанию (T-07); персона просит 1–3 предложения
temperature = 0.7

[pipeline.chunker]
first_min_words = 4            # первая фраза — по запятой уже после 4 слов: звук раньше (T-02)
next_min_words = 10            # остальные — длиннее: интонация естественнее
max_words = 25                 # фраза без знаков препинания режется по пробелу

[pipeline.filler]
enabled = true                 # междометие, если звук ответа не готов к сроку (T-17)
after_ms = 1000                # срок от начала хода: выше бюджета TTFA (800) — обычный ответ без «Хм»
phrases = ["Хм…", "Так…", "Сейчас…"]   # звучат по очереди; синтез — один раз при загрузке голоса

[tts]
backend = "silero"             # silero | piper | voice_server | none (без голоса); ADR-0012, ADR-0013, ADR-0031

[tts.silero]
model_path = "models/tts/silero/v5_6_ru.pt"   # относительно корня; скачать — README
speaker = "xenia"              # aidar | baya | kseniya | eugene | xenia
sample_rate = 48000            # 8000 | 24000 | 48000; 48 кГц — и быстрее, и чище (замер S-7.3)
threads = 4                    # потоки CPU для torch; GPU отдана LLM (T-11)
chunk_ms = 100                 # размер аудиокадра в UI

[tts.piper]
model_path = "models/tts/piper/ru_RU-denis-medium.onnx"   # рядом — .onnx.json
sample_rate = 22050            # частота голоса из его .onnx.json (medium — 22050)
length_scale = 1.0             # темп речи: больше — медленнее
chunk_ms = 100

[tts.voice_server]             # scripts/voice_server.py; не отвечает при старте — говорит Silero (ADR-0031)
base_url = "http://127.0.0.1:8090"
connect_timeout_s = 1.0
read_timeout_s = 10.0
sample_rate = 24000            # частота OmniVoice; сверяется с сервером при подключении
chunk_ms = 100

[scheduler]
idle_after_ms = 3000           # тишина после хода — простой: фон (факты, резюме) не мешает ответу (T-13)

[memory]
enabled = true                 # фоновая память: факты о пользователе и резюме истории (Этап 10)
store_path = "data/memory.sqlite"   # относительно корня; каталог создаётся при старте
vault_path = "data/vault"      # память открытым текстом, можно открыть в Obsidian (ADR-0020); в Obsidian Sync или облачной папке она уйдёт с компьютера
profile = ""                   # своя память у каждого: имя профиля; пусто — общая, как раньше (S-16.2)
restore_turns = 40             # столько последних ходов вернуть в историю при запуске; лишнее по бюджету отрежется
vault_poll_s = 2.0             # как быстро память замечает правку заметки; сверка всё равно ждёт простоя
background_slot_id = 1         # слот llama-server для фона; сервер — с --parallel 2 (start_llm.ps1)

[memory.generation]
max_tokens = 300               # факты в JSON и пересказ — коротко
temperature = 0.2              # пересказ и факты, а не творчество

[memory.facts]
dedup_score = 0.97             # близость e5 — уже известный факт: перефразировка 0.96–0.98, но и «живёт в Москве» против «в Казани» 0.96 — лучше дубль, чем потеря нового факта

[memory.retrieval]
limit = 3                      # фактов в справке хода
min_score = 0.8                # порог близости e5 (замер S-10.5): нужный факт 0.82–0.87, несвязанное до 0.81; лишнее отсекает модель
timeout_ms = 150               # дольше ход память не ждёт (T-12: бюджет поиска 40 мс)
factual_temperature = 0.3      # вопрос о мире: меньше фантазии (S-10.5)

[memory.e5]
model_dir = "models/memory/e5-small"   # model.onnx, tokenizer.json — ADR-0015
dimensions = 384
threads = 2                    # потоки CPU; GPU отдана LLM (T-11)
max_tokens = 256               # длина входа: факты и запросы короткие
batch_size = 8

[stt]
enabled = true                 # голосовой ввод в serve; модели грузятся при первом кадре микрофона (ADR-0016)

[stt.voice]
interim_ms = 800               # как часто считать промежуточную гипотезу: показ и прогрев LLM (T-05)
min_phrase_ms = 250            # короче — щелчок, а не фраза

unfinished_hold_ms = 1000       # S-14.2: сколько ждать продолжения фразы, оборванной на «я хотел…»; 0 — не ждать

[stt.voice.segmenter]
threshold = 0.5                # вероятность речи у детектора
start_ms = 96                  # столько речи подряд — начало фразы
end_silence_ms = 600           # пауза конца фразы: меньше — перебивает на вдохе, больше — ждёт дольше
barge_in_ms = 300              # столько речи — перебить витюбера (Этап 11)
pre_roll_ms = 192              # звук до начала речи: первый слог не теряется
max_phrase_s = 20.0            # длинная фраза закрывается принудительно

[stt.addressing]               # S-14.1: always — любая речь, by_name — только обращение по имени
mode = "always"
names = ["мика"]

[stt.sounds]                   # S-14.4: смех, аплодисменты и т.п.; выключено, пока точность не замерена
enabled = false
window_s = 3.0                 # длина разбираемого окна микрофона
gate_rms = 0.02                # тише — тишина, модель не тратится
min_gap_s = 120.0              # реагировать вслух не чаще
react_to = ["laughter", "applause"]

[stt.sound_model]              # SenseVoice (ADR-0027): только на CPU, грузится при enabled = true
model_path = "models/stt/sensevoice/model.int8.onnx"
tokens_path = "models/stt/sensevoice/tokens.txt"
threads = 2
timeout_s = 5.0

[stt.speakers]                 # S-14.3: метка «Собеседник N» в реплике; выключено, пока ошибки не замерены
enabled = false
threshold = 0.55               # сходство отпечатков: ниже — новый голос; подобрано на синтетике
min_phrase_s = 1.0             # короче отпечаток ненадёжен, фраза идёт без метки
max_speakers = 4
wait_s = 0.2                   # сколько ждать отпечаток после Whisper; дальше ответ идёт без метки

[stt.speaker_model]            # ERes2Net (ADR-0029): на CPU, грузится при первой фразе
model_path = "models/stt/speakers/eres2net_base_3dspeaker_16k.onnx"
threads = 2

[stt.vad]
model_path = "models/stt/vad/silero_vad.onnx"
threads = 1                    # окно короткое: один поток с запасом

[stt.whisper]
model_dir = "models/stt/whisper-turbo"
language = "ru"
device = "auto"                # auto: GPU, если есть CUDA с cuBLAS; иначе CPU (ADR-0016)
compute_type = "default"       # default: как квантована модель; int8 на CPU, int8_float16 на GPU
threads = 4
final_beam = 3                 # поиск финальной гипотезы; промежуточные — жадные

[plugins]
enabled = []                   # имена entry points группы vtuber.plugins; остальные не импортируются (docs/plugins.md)
setup_timeout_s = 10.0         # зависший setup не должен останавливать запуск
shutdown_timeout_s = 5.0
context_timeout_s = 0.03        # инструмент в горячем пути: не успел — ход идёт без него (приоритет 1)

[plugins.settings]             # настройки плагина: [plugins.settings.<имя>]

[resources]                    # бюджет видеопамяти (ADR-0017); числа из замеров, карту не опрашивает
total_vram_mb = 16384          # RTX 5070 Ti
system_reserve_mb = 1024       # рабочий стол, окно приложения, Live2D
wait_timeout_s = 30.0          # столько задача ждёт места, потом — понятный отказ
keep_loaded_s = 300.0          # столько модель простаивает в памяти, прежде чем выгрузиться
gpu_poll_s = 5.0               # опрос видеокарты (ADR-0018); 0 — только лимиты конфига
gpu_margin_mb = 512            # запас от фактически свободной памяти
max_tool_mb = 4700             # предел одной модели инструмента
max_background_mb = 2048       # предел всех фоновых моделей вместе

[resources.pinned]             # не вытесняется никогда; сменили модель — поправьте число
llm = 8900                     # Gemma 4 12B Q4: замер 8,65 ГБ (ADR-0004)
stt = 1700                     # Whisper turbo и VAD: около 1,6 ГБ (ADR-0016)

[gpu_probe]
timeout_s = 3.0                # nvidia-smi не ответил — считаем, что опрос не удался

[llama_server]                 # llama-server как дочерний процесс ядра (ADR-0019); адрес — из [llm].base_url
autostart = false              # при разработке сервер запускают сами: scripts/start_llm.ps1
executable = "llama/llama-server.exe"
model = "models/llm/model.gguf"
log_file = "logs/llama-server.log"
context_size = 16384           # на все слоты; больше нужного — лишняя VRAM и медленный prefill (T-10)
slots = 2                      # 0 — диалог, 1 — фон (Этап 10)
ready_timeout_s = 180.0        # загрузка модели с медленного диска
stop_timeout_s = 5.0
extra_args = []
# mmproj = "models/llm/mmproj.gguf"  # зрение (ADR-0024): занимает видеопамять, поэтому по желанию

[setup]                        # мастер первого запуска (S-13.2); в поставке включает config/setup.toml
enabled = false
install_dir = "."              # от него считаются пути файлов каталога
catalog_file = "config/catalog.toml"
choice_file = "config/setup.toml"   # выбор пользователя; свои правки — в user.toml, они важнее

[setup.http]
connect_timeout_s = 15.0
read_timeout_s = 60.0

[initiative]                   # персонаж заговаривает сам (S-15.1)
enabled = false                # выключено: без этого молчит, пока к нему не обратятся
idle_after_s = 180.0           # сколько тишины после конца речи ждать
max_unanswered = 2             # реплик подряд без ответа ведущего; дальше молчит
when_hidden = false            # говорить ли, когда окно свёрнуто
poll_s = 1.0                   # как часто проверять, свободно ли

[supervisor]                   # самовосстановление (S-17.1, ADR-0021); только в serve
enabled = true
check_s = 2.0                  # как часто спрашивать llama-server, жив ли он
health_timeout_s = 2.0         # не ответил за это время — считается зависшим
failures_to_restart = 2        # подряд: одна неудачная проверка — ещё не сбой
backoff_s = 1.0                # пауза перед первой попыткой, дальше удваивается
backoff_max_s = 30.0
max_attempts = 4               # затем — понятная ошибка, а не перезапуск по кругу
stable_s = 120.0               # столько проработал без сбоя — счёт попыток сначала
voice_timeout_s = 30.0         # голос молчит дольше — считается зависшим
stt_timeout_s = 60.0           # на CPU длинная фраза распознаётся десятки секунд
