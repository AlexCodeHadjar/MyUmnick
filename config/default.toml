# Настройки по умолчанию — единственный источник умолчаний (в коде их нет).
# Локальные переопределения: config/user.toml (не в git, пример — user.example.toml).
# Переменные окружения сильнее файлов: VTUBER_<СЕКЦИЯ>__<ПОЛЕ>, например VTUBER_LOGGING__LEVEL=DEBUG.
# Новая секция появляется вместе с модулем, который её описывает: лишний ключ — ошибка старта.

[logging]
level = "INFO"                 # DEBUG | INFO | WARNING | ERROR; DEBUG — потоковые детали (T-15)
